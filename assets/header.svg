<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 228" width="880" height="228" role="img">
  <title>Aurel-Cristian Grosu, Fullstack aus Langenfeld</title>
  <desc>Gerade: Synaplan bei metadist, OnlyWhisper, Mein Langenfeld, Squad Allstars Germany.</desc>
  <defs>
    <clipPath id="card">
      <rect width="880" height="228" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="228" fill="#0e0e11"/>
    <rect width="3" height="228" fill="#bbf631"/>

    <text x="40" y="52" fill="#9e9ea9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.4">FULLSTACK</text>
    <text x="840" y="52" fill="#9e9ea9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.4" text-anchor="end">LANGENFELD</text>

    <text x="40" y="112" fill="#f3f2ec" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="600">Aurel-Cristian Grosu</text>

    <text x="40" y="162" fill="#9e9ea9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">gerade</text>
    <rect x="118" y="148" width="9" height="18" fill="#bbf631">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <g fill="#f3f2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="138" y="162" opacity="1">
        synaplan, bei metadist
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.20;0.23;0.97;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="138" y="162" opacity="0">
        onlywhisper für den mac
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.45;0.48;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="138" y="162" opacity="0">
        mein-langenfeld.de
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.53;0.70;0.73;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="138" y="162" opacity="0">
        squad allstars germany
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.78;0.92;0.95;1" dur="16s" repeatCount="indefinite"/>
      </text>
    </g>

    <line x1="40" y1="196" x2="840" y2="196" stroke="#bbf631" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="800">
      <animate attributeName="stroke-dashoffset" values="800;0" dur="1.6s" begin="0.2s" fill="freeze"/>
    </line>
  </g>
</svg>
